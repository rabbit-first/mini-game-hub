<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#eef3ef">
	<title>五子棋 · 双人对弈</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #1c3028;
			--muted: #718078;
			--green: #245c46;
			--green-deep: #194533;
			--line: #dce5df;
			--paper: #eef3ef;
			--panel: #fff;
			--wood: #dfb86e;
			--cell-size: min(34px, calc((100vw - 74px) / 15));
		}

		* { box-sizing: border-box; }

		a {
			text-decoration: none;
			color: #464feb;
		}

		tr th, tr td {
			border: 1px solid #e6e6e6;
		}

		tr th {
			background-color: #f5f5f5;
		}

		body {
			min-width: 320px;
			min-height: 100vh;
			margin: 0;
			padding: 38px 24px;
			color: var(--ink);
			background-color: var(--paper);
			background-image: radial-gradient(#d3dfd7 0.8px, transparent 0.8px);
			background-size: 20px 20px;
			font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif;
		}

		.page { width: min(100%, 1000px); margin: 0 auto; }

		.page-header {
			display: flex;
			align-items: flex-end;
			justify-content: space-between;
			gap: 20px;
			margin-bottom: 25px;
		}

		.kicker {
			margin: 0 0 9px;
			color: var(--green);
			font-size: 12px;
			font-weight: 700;
			letter-spacing: 1.8px;
		}

		h1 {
			margin: 0;
			font-family: Georgia, "Songti SC", serif;
			font-size: clamp(34px, 6vw, 48px);
			font-weight: 700;
			line-height: 1.1;
			letter-spacing: 0;
		}

		.subtitle { margin: 10px 0 0; color: var(--muted); font-size: 14px; }

		.reset {
			display: inline-flex;
			min-height: 44px;
			align-items: center;
			justify-content: center;
			gap: 8px;
			padding: 0 15px;
			border: 1px solid #bfd0c5;
			border-radius: 5px;
			background: var(--panel);
			color: var(--green-deep);
			font: inherit;
			font-size: 14px;
			font-weight: 700;
			cursor: pointer;
			transition: background-color 140ms ease, border-color 140ms ease;
		}

		.reset:hover { border-color: var(--green); background: #f4f8f5; }
		.reset-icon { font-size: 18px; line-height: 1; }

		.game-layout {
			display: grid;
			grid-template-columns: minmax(0, 1fr) 250px;
			align-items: start;
			gap: 24px;
		}

		.board-panel, .side-panel {
			border: 1px solid var(--line);
			border-radius: 7px;
			background: var(--panel);
			box-shadow: 0 12px 36px rgb(34 63 47 / 7%);
		}

		.board-panel { padding: 20px; }

		.board-heading {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			margin-bottom: 16px;
		}

		.board-heading h2 { margin: 0; font-size: 15px; }
		.board-size { color: var(--muted); font-size: 12px; }

		.board-wrap {
			display: grid;
			place-items: center;
			overflow: auto;
			padding: 12px;
			border-radius: 5px;
			background: #d5e0d9;
		}

		.board {
			display: grid;
			width: calc(var(--cell-size) * 15);
			height: calc(var(--cell-size) * 15);
			flex: 0 0 auto;
			padding: 0;
			border: 1px solid #b78a43;
			background-color: var(--wood);
			background-image:
				linear-gradient(90deg, rgb(255 246 208 / 10%) 1px, transparent 1px),
				linear-gradient(0deg, rgb(126 82 30 / 7%) 1px, transparent 1px),
				repeating-linear-gradient(3deg, transparent 0 13px, rgb(255 255 255 / 5%) 14px, transparent 16px 27px);
			background-size: var(--cell-size) var(--cell-size), var(--cell-size) var(--cell-size), auto;
			background-position: center;
			box-shadow: inset 0 1px 5px rgb(95 61 24 / 14%), 0 2px 3px rgb(43 58 47 / 9%);
		}

		.board-row { display: grid; grid-template-columns: repeat(15, var(--cell-size)); height: var(--cell-size); }

		.cell {
			position: relative;
			display: grid;
			width: var(--cell-size);
			height: var(--cell-size);
			place-items: center;
			padding: 0;
			border: 0;
			background: transparent;
			cursor: crosshair;
			-webkit-tap-highlight-color: transparent;
		}

		.cell::before, .cell::after {
			position: absolute;
			z-index: 0;
			display: block;
			background: rgb(77 53 24 / 72%);
			content: "";
			pointer-events: none;
		}

		.cell::before { top: 50%; right: 0; left: 0; height: 1px; }
		.cell::after { top: 0; bottom: 0; left: 50%; width: 1px; }

		.cell:focus-visible { outline: 2px solid #176b9b; outline-offset: -3px; z-index: 2; }

		.star-dot {
			position: absolute;
			z-index: 1;
			width: 5px;
			height: 5px;
			border-radius: 50%;
			background: #654923;
			pointer-events: none;
		}

		.stone {
			position: relative;
			z-index: 2;
			width: calc(var(--cell-size) * .76);
			height: calc(var(--cell-size) * .76);
			border-radius: 50%;
			opacity: 0;
			pointer-events: none;
			transform: scale(.65);
			transition: opacity 120ms ease, transform 120ms ease;
		}

		.cell.black .stone {
			opacity: 1;
			background: radial-gradient(circle at 34% 28%, #636969, #171c1b 68%);
			box-shadow: 0 2px 3px rgb(35 31 25 / 38%);
			transform: scale(1);
		}

		.cell.white .stone {
			opacity: 1;
			border: 1px solid #c8c8c2;
			background: radial-gradient(circle at 34% 28%, #fff, #e5e5dd 78%);
			box-shadow: 0 2px 3px rgb(35 31 25 / 28%);
			transform: scale(1);
		}

		.side-panel { padding: 19px; }
		.side-panel h2 { margin: 0 0 16px; font-size: 15px; }

		.turn-card {
			padding: 15px;
			border: 1px solid #dfe9e2;
			border-radius: 5px;
			background: #f5f8f5;
		}

		.turn-label { margin: 0 0 11px; color: var(--muted); font-size: 12px; }
		.turn-value { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; }

		.turn-stone {
			width: 22px;
			height: 22px;
			flex: 0 0 22px;
			border: 1px solid #c8c8c2;
			border-radius: 50%;
			background: radial-gradient(circle at 34% 28%, #fff, #e5e5dd 78%);
			box-shadow: 0 1px 2px rgb(35 31 25 / 20%);
		}

		.turn-stone.black {
			border-color: #171c1b;
			background: radial-gradient(circle at 34% 28%, #636969, #171c1b 68%);
		}

		.score-list { display: grid; gap: 0; margin-top: 15px; }

		.score-row {
			display: flex;
			align-items: center;
			justify-content: space-between;
			min-height: 49px;
			border-bottom: 1px solid #edf1ed;
			color: #4a5a51;
			font-size: 13px;
		}

		.score-name { display: inline-flex; align-items: center; gap: 8px; }
		.score-dot { width: 12px; height: 12px; border: 1px solid #c9c9c2; border-radius: 50%; background: #f7f7f2; }
		.score-dot.black { border-color: #171c1b; background: #202625; }
		.score-count { color: var(--ink); font-size: 15px; font-weight: 700; }

		.game-status {
			min-height: 44px;
			margin: 17px 0 0;
			padding: 11px 12px;
			border-left: 3px solid #80a58c;
			background: #f2f7f3;
			color: var(--green-deep);
			font-size: 13px;
			line-height: 1.5;
		}

		.game-status.won { border-left-color: #dc8150; background: #fff5ed; color: #85421f; }

		.sr-only {
			position: absolute;
			width: 1px;
			height: 1px;
			overflow: hidden;
			clip: rect(0, 0, 0, 0);
			white-space: nowrap;
			clip-path: inset(50%);
		}

		@media (max-width: 720px) {
			body { padding: 25px 14px; }
			.game-layout { grid-template-columns: minmax(0, 1fr); gap: 14px; }
			.board-panel { padding: 14px 10px; }
			.board-wrap { padding: 8px; }
			.side-panel { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; gap: 0 14px; }
			.side-panel h2 { grid-column: 1 / -1; margin-bottom: 12px; }
			.turn-card { grid-row: span 2; }
			.score-list { margin-top: 0; }
			.game-status { grid-column: 1 / -1; margin-top: 12px; }
		}

		@media (max-width: 420px) {
			:root { --cell-size: min(34px, calc((100vw - 52px) / 15)); }
			body { padding-inline: 10px; }
			.page-header { align-items: center; }
			.subtitle { max-width: 200px; line-height: 1.5; }
			.reset { gap: 5px; padding-inline: 10px; font-size: 12px; }
			.side-panel { grid-template-columns: 1fr; }
			.turn-card { grid-row: auto; }
			.score-list { margin-top: 10px; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { transition-duration: .01ms !important; }
		}
	</style>
</head>
<body>
	<main class="page">
		<header class="page-header">
			<div>
				<p class="kicker">TWO PLAYER · CLASSIC</p>
				<h1>五子棋</h1>
				<p class="subtitle">双人对弈</p>
			</div>
			<button id="reset-button" class="reset" type="button" title="重新开始对局">
				<span class="reset-icon" aria-hidden="true">↻</span>
				<span>重新开始</span>
			</button>
		</header>

		<div class="game-layout">
			<section class="board-panel" aria-labelledby="board-title">
				<div class="board-heading">
					<h2 id="board-title">对弈棋盘</h2>
					<span class="board-size">15 × 15</span>
				</div>
				<div class="board-wrap">
					<div id="board" class="board" role="grid" aria-label="五子棋棋盘，15 行 15 列"></div>
				</div>
			</section>

			<aside class="side-panel" aria-labelledby="match-title">
				<h2 id="match-title">本局对战</h2>
				<div class="turn-card">
					<p class="turn-label">当前回合</p>
					<div class="turn-value">
						<span id="turn-stone" class="turn-stone black" aria-hidden="true"></span>
						<span id="turn-text">黑棋落子</span>
					</div>
				</div>
				<div class="score-list" aria-label="棋子数量">
					<div class="score-row"><span class="score-name"><span class="score-dot black" aria-hidden="true"></span>黑棋</span><strong id="black-count" class="score-count">0</strong></div>
					<div class="score-row"><span class="score-name"><span class="score-dot" aria-hidden="true"></span>白棋</span><strong id="white-count" class="score-count">0</strong></div>
				</div>
				<p id="game-status" class="game-status" role="status" aria-live="polite">黑棋先行</p>
			</aside>
		</div>
	</main>

	<script>
		const boardElement = document.querySelector("#board");
		const turnText = document.querySelector("#turn-text");
		const turnStone = document.querySelector("#turn-stone");
		const blackCount = document.querySelector("#black-count");
		const whiteCount = document.querySelector("#white-count");
		const gameStatus = document.querySelector("#game-status");
		const resetButton = document.querySelector("#reset-button");
		const boardSize = 15;
		const starPoints = new Set([3, 7, 11]);
		const directions = [[1, 0], [0, 1], [1, 1], [1, -1]];
		const cells = [];

		let currentPlayer = "black";
		let gameOver = false;
		let activeCell = 0;

		for (let row = 0; row < boardSize; row += 1) {
			const rowElement = document.createElement("div");
			rowElement.className = "board-row";
			rowElement.setAttribute("role", "row");

			for (let col = 0; col < boardSize; col += 1) {
				const index = row * boardSize + col;
				const cell = document.createElement("button");
				cell.type = "button";
				cell.className = "cell";
				cell.setAttribute("role", "gridcell");
				cell.setAttribute("aria-label", `第 ${row + 1} 行，第 ${col + 1} 列，空位`);
				cell.tabIndex = index === 0 ? 0 : -1;
				cell.dataset.row = String(row);
				cell.dataset.col = String(col);

				if (starPoints.has(row) && starPoints.has(col)) {
					const star = document.createElement("span");
					star.className = "star-dot";
					star.setAttribute("aria-hidden", "true");
					cell.append(star);
				}

				const stone = document.createElement("span");
				stone.className = "stone";
				stone.setAttribute("aria-hidden", "true");
				cell.append(stone);
				cell.addEventListener("click", () => placeStone(row, col, cell));
				cell.addEventListener("keydown", (event) => moveFocus(event, row, col));
				rowElement.append(cell);
				cells.push(cell);
			}

			boardElement.append(rowElement);
		}

		const board = Array.from({ length: boardSize }, () => Array(boardSize).fill(null));

		function moveFocus(event, row, col) {
			const moves = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
			const move = moves[event.key];
			if (!move) return;

			event.preventDefault();
			const nextRow = Math.max(0, Math.min(boardSize - 1, row + move[0]));
			const nextCol = Math.max(0, Math.min(boardSize - 1, col + move[1]));
			const nextIndex = nextRow * boardSize + nextCol;
			cells[activeCell].tabIndex = -1;
			activeCell = nextIndex;
			cells[activeCell].tabIndex = 0;
			cells[activeCell].focus();
		}

		function countLine(row, col, rowStep, colStep, player) {
			let count = 0;
			let nextRow = row + rowStep;
			let nextCol = col + colStep;

			while (
				nextRow >= 0 && nextRow < boardSize &&
				nextCol >= 0 && nextCol < boardSize &&
				board[nextRow][nextCol] === player
			) {
				count += 1;
				nextRow += rowStep;
				nextCol += colStep;
			}

			return count;
		}

		function hasWon(row, col, player) {
			return directions.some(([rowStep, colStep]) => {
				const lineLength = 1
					+ countLine(row, col, rowStep, colStep, player)
					+ countLine(row, col, -rowStep, -colStep, player);
				return lineLength >= 5;
			});
		}

		function updateTurn() {
			const isBlackTurn = currentPlayer === "black";
			turnText.textContent = isBlackTurn ? "黑棋落子" : "白棋落子";
			turnStone.classList.toggle("black", isBlackTurn);
			turnStone.classList.toggle("white", !isBlackTurn);
		}

		function placeStone(row, col, cell) {
			if (gameOver) return;

			const index = row * boardSize + col;
			cells[activeCell].tabIndex = -1;
			activeCell = index;
			cell.tabIndex = 0;
			if (board[row][col] !== null) return;

			board[row][col] = currentPlayer;
			cell.classList.add(currentPlayer);
			cell.setAttribute("aria-label", `第 ${row + 1} 行，第 ${col + 1} 列，${currentPlayer === "black" ? "黑棋" : "白棋"}`);
			document.querySelector(`#${currentPlayer}-count`).textContent = String(
				Number(document.querySelector(`#${currentPlayer}-count`).textContent) + 1
			);

			if (hasWon(row, col, currentPlayer)) {
				gameOver = true;
				const winner = currentPlayer === "black" ? "黑棋" : "白棋";
				turnText.textContent = `${winner}获胜`;
				gameStatus.textContent = `${winner}连成五子，赢得本局。`;
				gameStatus.classList.add("won");
				window.alert(`${winner}获胜！`);
				return;
			}

			currentPlayer = currentPlayer === "black" ? "white" : "black";
			updateTurn();
			gameStatus.textContent = `当前由${currentPlayer === "black" ? "黑棋" : "白棋"}落子`;
		}

		function resetGame() {
			for (let row = 0; row < boardSize; row += 1) {
				board[row].fill(null);
			}

			cells.forEach((cell, index) => {
				cell.classList.remove("black", "white");
				cell.setAttribute("aria-label", `第 ${Number(cell.dataset.row) + 1} 行，第 ${Number(cell.dataset.col) + 1} 列，空位`);
				cell.tabIndex = index === 0 ? 0 : -1;
			});

			currentPlayer = "black";
			gameOver = false;
			activeCell = 0;
			blackCount.textContent = "0";
			whiteCount.textContent = "0";
			gameStatus.textContent = "黑棋先行";
			gameStatus.classList.remove("won");
			updateTurn();
		}

		resetButton.addEventListener("click", resetGame);
		updateTurn();
	</script>
</body>
</html>
